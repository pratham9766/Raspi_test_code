# Raspberry Pi 5 Hardware Test Utility — Configuration
# Edit this file to match your wiring.

board:
  pin_numbering: BCM
  i2c_bus: 1
  spi_bus: 0
  spi_device: 0

# ── BNO085 IMU (I2C) ──────────────────────────────────────────────────────────
bno085:
  interface: i2c
  address: 0x4A          # 0x4A default; 0x4B if PS1 pulled high
  sda_gpio: 2
  scl_gpio: 3
  refresh_hz: 10

# ── BMP388 Pressure Sensor (I2C) ─────────────────────────────────────────────
bmp388:
  interface: i2c
  address: 0x76          # 0x76 default; 0x77 if SDO pulled high
  sda_gpio: 2
  scl_gpio: 3
  sea_level_pressure_hpa: 1013.25
  refresh_hz: 5

# ── PCA9685 PWM Driver (I2C) ─────────────────────────────────────────────────
pca9685:
  interface: i2c
  address: 0x40
  frequency_hz: 50
  oe_gpio: 4              # Output Enable pin (active LOW). GPIO4 → driven LOW to enable outputs.

# ── Standalone Servo (channel 0, for test_servo menu) ────────────────────────
servo:
  pca9685_channel: 0
  min_pulse_us: 500
  max_pulse_us: 2500
  min_angle: 0
  max_angle: 180
  settle_seconds: 0.3

# ── Stepper Motor (28BYJ-48 via ULN2003) ─────────────────────────────────────
stepper:
  in1_gpio: 18
  in2_gpio: 23
  in3_gpio: 24
  in4_gpio: 25
  step_delay_ms: 2
  steps_per_revolution: 4096

# ── Gimbal (stepper X-axis + servo Y-axis) ───────────────────────────────────
# X axis (yaw / pan)   : 28BYJ-48 stepper via ULN2003 (GPIO 18,23,24,25)
# Y axis (pitch / tilt): Servo on PCA9685 channel 0
# OE                   : GPIO4 (active-LOW — drive LOW to enable servo output)
gimbal:

  servo:
    channel: 0              # PCA9685 channel for Y axis
    center_angle: 90        # Default safe-center position (degrees)
    min_angle: 30           # Soft lower limit
    max_angle: 150          # Soft upper limit
    step_angle: 5           # Degrees per keyboard step command
    min_pulse_us: 500       # PWM minimum pulse width (µs)
    max_pulse_us: 2500      # PWM maximum pulse width (µs)
    settle_s: 0.3           # Settle time after each move (seconds)

  servo_driver:
    oe_gpio: 4              # GPIO4 → Output Enable line
    active_low: true        # true = GPIO LOW enables outputs (most boards)

  stepper:
    motor: "28BYJ-48"
    driver_ic: "ULN2003"
    in1_gpio: 18
    in2_gpio: 23
    in3_gpio: 24
    in4_gpio: 25
    sequence: "half_step"   # half_step (default) or full_step
    step_delay_ms: 4        # Delay between steps — do not set below 2 ms
    direction_inverted: false
    max_relative_steps: 2000  # Hard limit |relative_x_steps|

  bno085:
    enabled: true
    feedback_enabled: false   # Set true only after verifying axis mapping
    refresh_hz: 10
    bno_roll_to_x: false      # DISABLED — axis mapping unverified
    bno_pitch_to_y: true      # Pitch → Y servo correction
    kp_y: 0.3                 # Proportional gain (conservative)
    deadband_deg: 2.0         # Ignore errors < this (degrees)
    max_servo_correction_deg: 10.0  # Cap per-loop correction

  safety:
    require_confirmation: true   # Prompt before any movement starts
    disable_outputs_on_exit: true  # Always disable OE on exit

# ── Camera ────────────────────────────────────────────────────────────────────
camera:
  resolution: [1920, 1080]
  preview_seconds: 5
  image_dir: captures/images
  video_dir: captures/videos
  video_seconds: 10
  timelapse_interval_seconds: 2.0

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  save_logs: true
  level: INFO
  log_dir: logs
  csv_enabled: true
  csv_filename: sensor_data.csv
